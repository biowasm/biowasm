name: Deploy biowasm v3

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        default: "stg"
      tools_to_compile:
        description: "Tools to compile to WebAssembly (comma-separated; 'all'; 'none')"
        required: true
        default: "seqtk"
      versions:
        description: "Versions to compile (comma-separated)"
        required: true
        default: "1.4"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy biowasm v3 (${{ github.event.inputs.env }})
    container:
      image: emscripten/emsdk:6.0.13
    steps:
      # ------------------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------------------
      - name: Check out biowasm repo (${{ github.event.inputs.env }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The container runs as root but the checkout is owned by the runner user, so git
      # refuses to touch it. Without this the manifest commit below silently does nothing
      - name: Mark the checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test Emscripten
        if: ${{ github.event.inputs.tools_to_compile != 'none' }}
        run: emcc -v

      # ------------------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------------------
      - name: Compile to WebAssembly (${{ github.event.inputs.env }})
        if: ${{ github.event.inputs.tools_to_compile != 'none' }}
        run: |
          apt-get update && apt-get install -yqq autoconf liblzma-dev zlib1g-dev
          bin/compile.py --tools ${{ github.event.inputs.tools_to_compile }} --env ${{ github.event.inputs.env }} --versions ${{ github.event.inputs.versions }}

      # Turns build/ into the manifest and the `wrangler kv bulk put` payloads. Separate from
      # compile.py because the manifest records what is live in KV, which the deploy decides
      - name: Generate manifest and KV payloads (${{ github.event.inputs.env }})
        if: ${{ github.event.inputs.tools_to_compile != 'none' }}
        run: bin/manifest.py --env ${{ github.event.inputs.env }}

      # ------------------------------------------------------------------------
      # Deploy to Cloudflare Workers
      # ------------------------------------------------------------------------
      # Runs even when tools_to_compile is "none", so the website can be deployed on its own
      - name: Deploy (${{ github.event.inputs.env }})
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # The compile step above is skipped when tools_to_compile is "none", so don't
          # rely on the `apt-get update` it runs
          apt-get update && apt-get install -y jq

          # Install Node.js
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          \. "$HOME/.nvm/nvm.sh"
          nvm install 22

          # Deploy
          cd web/
          npm install
          # Only upload tool files to KV if we compiled some; otherwise build/ doesn't exist
          if [ "${{ github.event.inputs.tools_to_compile }}" != "none" ]; then
            for batch in ../build/cf_kv_upload.*.json; do
              [ -e "$batch" ] || continue
              # Without --remote, wrangler v4 writes to a local store and still exits 0
              npx wrangler kv bulk put --remote --binding=CDN --env=${{ github.event.inputs.env }} "$batch"
            done
          fi
          npx wrangler deploy --env=${{ github.event.inputs.env }}

      # ------------------------------------------------------------------------
      # Save changes to manifest (only after successful deploy!)
      # ------------------------------------------------------------------------
      - name: Save changes to manifest.json (${{ github.event.inputs.env }})
        if: ${{ github.event.inputs.tools_to_compile != 'none' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update Biowasm manifest
          file_pattern: biowasm.manifest${{ github.event.inputs.env == 'stg' && '.stg' || '' }}.json biowasm.sizes.json
