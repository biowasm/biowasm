<script src="https://biowasm.com/cdn/v3/aioli.js"></script>
<script type="module">
const CLI = await new Aioli(["mash/2.3"]);

// Two 600bp sequences, where genomeB is a ~3% mutated copy of genomeA
await CLI.mount([
	{ name: "genomeA.fa", data: ">genomeA\nAAGCCCAATAAACCACTCTGACTGGCCGAATAGGGATATAGGCAACGACATGTGCGGCGA\nCCCTTGCGACAGTGACGCTTTCGCCGTTGCCTAAACCTATTTGAAGGAGTCTAGCAGCCG\nCAGTAAGGCACAATACCTCGTCCGTGTTACCAGACCAAACAAGACGTCCTCTTCAATGTT\nTAAATGACCCTCTCGTCATAAAACCTTTCTACTATGTGTTCCGCAAGAATCAACAACTAC\nAATGGCGCGTCGTGAATAACGCGACGGCTGAGACGAACGGCGCGTGAATGAAGCGCTTAA\nACAGCTCAGGAGCCAGTCCCCTACGTCGCATATCCTGGCCACTGGAGGTGAAGCGAATGG\nTATCGATACGTAGGAGGTGTGCCTTCGTAGGCTGTTTCTCAGGACGCCCAACTATTCTTT\nCCAATCCTACATCTGTTTCTTGCGTCGTAGCGGGACCCTCCATTGTTACTTATTAGGTTC\nTCGTTATGTCTCATAATCTCAGTGCTGGTGTGATAAGCAAACCACCCTACTGGCACGAAG\nTTCACAGAAGTGAGATTATGTCTCGTTTGGCAGTCTTGATGCTCGGGGGACACTTCTTTA" },
	{ name: "genomeB.fa", data: ">genomeB\nAAGCCCAATAAACCACTCTGACTGGCCGAATAGGGATATAGGCAACGACATGTGCGGCGA\nCCCTTGCGACAGTGACGCTTTCGCCGTTGCCTAAAGCTATTTGAAGGAGTCTAGCAGCCG\nCAGTAAGGCACAATACCTCGTCCGTGTTACCAGACCAAACAAGACGTCCTCTTCAATGTT\nTAAATGACCCTCTCGTCATAAAACCTTTCTACTATGTGTTCCGCAAAAATCAACAACTAC\nAATGGCGCGGCGTGAATAACGCGACGGCTGAGACGAATGGCGCGTGAATGAAGCGCTTAA\nAGAGCTCAGGAGCAAGTCCCCTACGTCGCATATCCTGGTCACTGGAGGTGAAACGAATGG\nCATCGATACGTAGGAGGAGTGCCTTCGTAGGCTGTTTCTCAGGACGCCCAACTAATCTTT\nCCAATCCTACATCTGATTCTTGCGTCGTAGCGGGACCCTCCATTCTTACTTATTAGGTTC\nTCGTGATGTCTCATAATCTCAGTGCTGGTGTGATAAGCAAACCACCCTACTGGCACGAAG\nTTCTCAGAAGTGAGATTATGTCTAGTGTGGCAGTCTTGATGCTCGGGGGACACTTGTTTA" }
]);

// Reduce genomeA to a MinHash sketch (smaller k and sketch size than the defaults,
// which assume whole genomes rather than the 600bp toy sequences used here)
await CLI.exec("mash sketch -k 15 -s 100 -o genomeA genomeA.fa");
const output = await CLI.exec("mash info genomeA.msh");
document.getElementById("output").innerHTML = output;

// Estimate how far apart the two genomes are
const output2 = await CLI.exec("mash dist -k 15 -s 100 genomeA.fa genomeB.fa");
document.getElementById("output2").innerHTML = output2;
</script>
