	{ name: "ref.fa", data: ">chr1\nAGGTAAGGTGGTTGAGATCTGGACTTTTGACGCCTGGAGCCCGCAGTGCTCCTCGAAAAGTAGCCATGCCTTGGGCTGCT\nCCCAGGCGCTCCGTTGTTCTAGTGCTTTCACCAGCCAAGTATAGTTGGACGTTCGAAGTTGAGTTTCCTGAAATACCTAG\nCCCATGTAGCCGGACATAGTCTAGTAGTGTATCCCACCCCTCCCCATTTTATTGCTTGTCAGGGAGGGACCGACTAGTGA\nGGCTCCCACTGTAAAAGGTCTGGGTCACTTGTGTCTCGCAGCTTATCTGCGGAGAACGGAGCCACAAGGTGCCAACCCCT\nGTGGTGCGTCGATCTGTTTCTTATCACGGCTGAGATTTTGTGACGAGTAATGGTCTGGAGAGCCAGTACGCTAGAGCCTT\nTTAGAGATGTGACCAAGATCTGCGGCTAGTGCGATACCTACGCTGTCAAGGCTCTCAGGACTCTCAGATGACCCAGGCGT\nTTTGGACCTGAGCCGCTCTCAAATCAACCGAGGAACACGACGGGGACCAGTTTGCCGCTTACATCTACTCAACAGGGTCC\nAGGCCCATTACTTGCAGACAGGGTCTCGTCTCGGAGTGATGTGATTACGCCAAAAGCGAACGCGACGAAAGGTCTAATCC\nTAATAATCCTGTGCTGATGAAGGAAGATTATGTTCCAGTTCATGTCGGTGCCGCCTGGACAGATGCGGCCATAAAGCTGA\nGATTGCCCTGCGTCCGCTGGCATCACAAGCCGAGGTACAAACAATCAACTGTAATATTGTGATTGTGTTTTGTAAGCAAG\nTAGGGGGCACGCAACAGAAGGCCGAACGATTTTCGGCCAACTCCGGCGGGACACGGGCGTCGGGACTGGGAAGCCCCCAG\nAGATCACCTGTCGCCCAGAAGGTCTGAACGGCGCGTGCTAGAGAACGCCCACAGCCCTGGTTCGTGTCCACCGTTTGCTT\nAAAGCTCAAAAAAGGTGCCTAACAGAATTGCGACACTATTCTAGCTCACGTCCAGGCCATGTCTTGCTCGGGCTTCGGAC\nAGGCGTATGCCGTCTATGCCTGGCCCCACTCGGGCTCCCCCCGTCTTACCCTGAAAAGTTGAGGGCACATTTAGGCATGA\nTCTGTCTCAGTACACGTCGTCTTCCGGACTGAACACATCGCACAGAGGCCTAAGGCGCATTCTGGCTGTCTGCTTACTTG\n" },
	// Two read pairs from 350bp fragments at chr1:151-500 and chr1:701-1050; each R1 carries one SNP
	{ name: "r1.fq", data: "@pair1/1\nAAATACCTAGCCCATGTAGCCGGACATAGTCTAGTAGTGTCTCCCACCCCTCCCCATTTTATTGCTTGTCAGGGAGGGACCGACTAGTGAGGCTCCCACT\n+\nIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\n@pair2/1\nAGATGCGGCCATAAAGCTGAGATTGCCCTGCGTCCGCTGGAATCACAAGCCGAGGTACAAACAATCAACTGTAATATTGTGATTGTGTTTTGTAAGCAAG\n+\nIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\n" },
	{ name: "r2.fq", data: "@pair1/2\nGAGAGCGGCTCAGGTCCAAAACGCCTGGGTCATCTGAGAGTCCTGAGAGCCTTGACAGCGTAGGTATCGCACTAGCCGCAGATCTTGGTCACATCTCTAA\n+\nIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\n@pair2/2\nGCATACGCCTGTCCGAAGCCCGAGCAAGACATGGCCTGGACGTGAGCTAGAATAGTGTCGCAATTCTGTTAGGCACCTTTTTTGAGCTTTAAGCAAACGG\n+\nIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\n" },

	{ name: "tx.fa", data: ">transcript1\nAGTGCTTTCACCAGCCAAGTATAGTTGGACGTTCGAAGTTGAGTTTCCTGAAATACCTAGCCCATGTAGCCGGACATAGT\nCTAGTAGTGTATCCCACCCCTCCCCATTTTATTGCTTGTCAGGGAGGGACCGACTAGTGAGGCTCCCACTGCTCTCAGGA\nCTCTCAGATGACCCAGGCGTTTTGGACCTGAGCCGCTCTCAAATCAACCGAGGAACACGACGGGGACCAGTTTGCCGCTT\nACATCTACTCAACAGGGTCCAGGCCCATTACTTGCAGACAGGGTCTCGTCTCGGAGTGATTAGGGGGCACGCAACAGAAG\nGCCGAACGATTTTCGGCCAACTCCGGCGGGACACGGGCGTCGGGACTGGGAAGCCCCCAGAGATCACCTGTCGCCCAGAA\nGGTCTGAACGGCGCGTGCTAGAGAACGCCCACAGCCCTGGTTCGTGTCCA\n" }
]);

// Map paired-end short reads to SAM
const pairs = await CLI.exec("rammap -x sr -a ref.fa r1.fq r2.fq");

// Spliced alignment: the CIGAR's N operations should skip exactly the two introns
